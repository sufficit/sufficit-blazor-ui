version: 2

# Keeps the ASP.NET Core / Blazor package references and the pinned GitHub
# Actions current. The library has no third-party UI framework dependency;
# only Microsoft.AspNetCore.Components.* remains for the Razor SDK.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencies, frontend]
    commit-message:
      prefix: "chore(css)"

  - package-ecosystem: nuget
    directory: "/src"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
