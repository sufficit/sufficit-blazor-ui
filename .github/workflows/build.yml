name: Build

# This repository has no local build environment behind it: components are
# copied in from other projects, so CI is the only thing that proves they
# actually compile. Keep this workflow fast and unconditional.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Sufficit.Blazor.UI/Sufficit.Blazor.UI.csproj

      - name: Build
        # No -warnaserror yet: the components were copied in from a net9.0
        # codebase and are expected to surface nullability and analyzer
        # warnings first. Tighten this once the warning backlog is cleared —
        # turning it on before then would just block every PR.
        run: >
          dotnet build src/Sufficit.Blazor.UI/Sufficit.Blazor.UI.csproj
          --no-restore --configuration Release

      - name: Report warning count
        # Visibility without enforcement: makes the backlog measurable so the
        # move to -warnaserror is an informed decision rather than a guess.
        if: always()
        run: >
          dotnet build src/Sufficit.Blazor.UI/Sufficit.Blazor.UI.csproj
          --no-restore --configuration Release --no-incremental
          -v normal 2>&1 | grep -c "warning " || echo "0 warnings"
