name: Build

# Build both supported target frameworks and validate the installable package.
on:
  workflow_dispatch:
    inputs:
      update-baselines:
        description: "Recapture the committed visual baselines (chromium only)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  # write is needed by the baseline-refresh path in browser-tests, which commits
  # the recaptured screenshots back to the branch. Every other job only reads.
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css:
    name: CSS bundle and budget
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Install CSS tooling
        run: npm ci

      - name: Verify generated entrypoint and budgets
        run: npm run check:css

  build:
    name: Build (${{ matrix.target-framework }})
    needs: css
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target-framework: [net9.0, net10.0]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Sufficit.Blazor.UI.csproj

      - name: Build (warnings treated as errors)
        # Captures the log so the diagnostics step below can surface failures as
        # annotations.
        id: build
        run: |
          set -o pipefail
          dotnet build src/Sufficit.Blazor.UI.csproj \
            --no-restore --configuration Release \
            --framework ${{ matrix.target-framework }} -warnaserror \
            /p:ErrorEndLocation=true -maxcpucount:1 2>&1 | tee build.log

      - name: Surface build diagnostics
        # Re-emits compiler output as workflow errors so it shows up as
        # annotations. Without this, a failure that the annotation parser does
        # not recognise leaves nothing but an exit code.
        if: failure()
        run: |
          echo "--- first 60 diagnostic lines ---"
          grep -nE "error|warning [A-Z]+[0-9]+" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "--- raw tail of build log ---"
          tail -40 build.log | while IFS= read -r line; do echo "::error::LOG ${line}"; done
          echo "--- razor/component related ---"
          grep -niE "razor|taghelper|component" build.log | head -20 | while IFS= read -r line; do
            echo "::error::RAZOR ${line}"
          done

  pack:
    name: Pack and inspect
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Sufficit.Blazor.UI.csproj

      - name: Resolve package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          else
            package_version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "invalid SemVer package version: $package_version" >&2
            exit 1
          fi
          echo "SUI_PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Pack without publishing
        run: |
          dotnet pack src/Sufficit.Blazor.UI.csproj \
            --no-restore --configuration Release --output artifacts/packages \
            /p:Version="$SUI_PACKAGE_VERSION" \
            /p:ContinuousIntegrationBuild=true

      - name: Inspect package and test minimal consumers
        run: ./scripts/validate-package.sh artifacts/packages/*.nupkg

  component-tests:
    name: Component tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Test bUnit contracts
        run: |
          set -o pipefail
          dotnet test tests/Sufficit.Blazor.UI.Tests/Sufficit.Blazor.UI.Tests.csproj \
            --configuration Release -warnaserror 2>&1 | tee component-test.log

      - name: Surface failing assertions
        # Same reason as in browser-tests: test output lands in storage that is
        # not reachable everywhere, so a red run would otherwise show only an
        # exit code.
        if: failure()
        run: |
          grep -nE "^\s*(Failed|Error Message|Assert\.|Expected|Actual|at Sufficit)" component-test.log \
            | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

  browser-tests:
    name: Browser and accessibility tests (${{ matrix.browser }})
    needs: component-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build catalog and browser tests
        run: dotnet build Sufficit.Blazor.UI.slnx --configuration Release -warnaserror

      - name: Install browser
        run: |
          tests/Sufficit.Blazor.UI.BrowserTests/bin/Release/net10.0/.playwright/node/linux-x64/node \
            tests/Sufficit.Blazor.UI.BrowserTests/bin/Release/net10.0/.playwright/package/cli.js \
            install --with-deps "${{ matrix.browser }}"

      - name: Run Playwright and axe
        env:
          BROWSER: ${{ matrix.browser }}
          SUI_CATALOG_URL: http://127.0.0.1:5180
          SUI_CATALOG_SUBPATH_URL: http://127.0.0.1:5181/app/
          SUI_BASELINE_DIR: ${{ github.workspace }}/docs/baselines/catalog
          SUI_VISUAL_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/visual/${{ matrix.browser }}
          # Regenerate the committed screenshots instead of comparing against
          # them. Full-page screenshots take their height from rendered content,
          # so any layout change makes the stored baselines stale — and there was
          # no way to refresh them from CI, where they must be captured to match
          # the runner's fonts and rendering.
          SUI_UPDATE_BASELINES: ${{ github.event.inputs.update-baselines == 'true' && '1' || '' }}
        run: |
          dotnet run \
            --project samples/Sufficit.Blazor.UI.Catalog/Sufficit.Blazor.UI.Catalog.csproj \
            --configuration Release --no-build \
            --urls "$SUI_CATALOG_URL" >catalog.log 2>&1 &
          catalog_pid=$!
          # ASPNETCORE_ prefix required: WebApplication.CreateBuilder only reads
          # environment variables with that prefix into IConfiguration, and the
          # catalog resolves the value via Configuration["PathBase"]. A bare
          # PathBase=/app is silently ignored, so this instance would serve at
          # the root and every sub-path assertion would fail.
          ASPNETCORE_PathBase=/app dotnet run \
            --project samples/Sufficit.Blazor.UI.Catalog/Sufficit.Blazor.UI.Catalog.csproj \
            --configuration Release --no-build \
            --urls "http://127.0.0.1:5181" >catalog-subpath.log 2>&1 &
          catalog_subpath_pid=$!
          trap 'kill "$catalog_pid" "$catalog_subpath_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent "$SUI_CATALOG_URL" >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat catalog.log
              exit 1
            fi
            sleep 1
          done

          for attempt in $(seq 1 30); do
            if curl --fail --silent "$SUI_CATALOG_SUBPATH_URL" >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat catalog-subpath.log
              exit 1
            fi
            sleep 1
          done

          set -o pipefail
          dotnet test tests/Sufficit.Blazor.UI.BrowserTests/Sufficit.Blazor.UI.BrowserTests.csproj \
            --configuration Release --no-build 2>&1 | tee browser-test.log

      - name: Commit regenerated baselines
        # Only on an explicit manual run with update-baselines, and only from
        # chromium, which is the engine the committed screenshots are captured
        # with (the test ignores itself on the others).
        if: >
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.update-baselines == 'true'
          && matrix.browser == 'chromium'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/baselines/catalog
          if git diff --cached --quiet; then
            echo "Baselines already current."
            exit 0
          fi
          git commit -m "chore(baselines): recapture catalog visual baselines"
          git push

      - name: Surface failing assertions
        # Test artifacts land in storage that is not reachable from every
        # environment, so a red run could show an exit code and nothing else.
        # Re-emit the failing assertions as annotations, which are readable
        # through the API.
        if: failure()
        run: |
          echo "::group::failing tests"
          # The previous pattern anchored on leading whitespace, which the
          # runner's NUnit output does not use, so a red run produced no
          # annotations at all and the failure was undiagnosable from the API.
          # Match the shapes NUnit actually emits, unanchored.
          grep -nE "(Failed |error NUnit|Error Message|Stack Trace|Assert\.|Expected:|But was:|Actual:|at Sufficit|Playwright|TimeoutException|axe)" \
            browser-test.log | head -60 \
            | while IFS= read -r line; do echo "::error::${line}"; done

          # Always emit the summary line, so even an unrecognised failure shape
          # reports how many tests failed and which run it was.
          grep -nE "(Passed!|Failed!|Total tests|test(s)? failed)" browser-test.log \
            | tail -5 | while IFS= read -r line; do echo "::error::SUMMARY ${line}"; done

          # Last resort: if nothing above matched, the log format changed again
          # — dump the tail verbatim rather than leaving an exit code alone.
          if ! grep -qE "(Failed |Error Message|Assert\.|Expected:)" browser-test.log; then
            echo "::error::No recognised assertion output; dumping tail verbatim"
            tail -50 browser-test.log | while IFS= read -r l; do echo "::error::RAW ${l}"; done
          fi
          echo "::endgroup::"
          echo "--- catalog logs ---"
          tail -15 catalog.log 2>/dev/null | while IFS= read -r l; do echo "::error::CATALOG ${l}"; done
          tail -15 catalog-subpath.log 2>/dev/null | while IFS= read -r l; do echo "::error::SUBPATH ${l}"; done

      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics-${{ matrix.browser }}
          if-no-files-found: ignore
          path: |
            artifacts/visual/${{ matrix.browser }}
            catalog.log
            catalog-subpath.log

  lighthouse:
    name: Lighthouse performance gate
    needs: component-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.x"
          cache: npm

      - name: Build catalog
        run: dotnet build Sufficit.Blazor.UI.slnx --configuration Release -warnaserror

      - name: Install Chromium
        run: |
          tests/Sufficit.Blazor.UI.BrowserTests/bin/Release/net10.0/.playwright/node/linux-x64/node \
            tests/Sufficit.Blazor.UI.BrowserTests/bin/Release/net10.0/.playwright/package/cli.js \
            install --with-deps chromium

      - name: Audit the published catalog
        env:
          SUI_CATALOG_URL: http://127.0.0.1:5180
        run: |
          dotnet run \
            --project samples/Sufficit.Blazor.UI.Catalog/Sufficit.Blazor.UI.Catalog.csproj \
            --configuration Release --no-build \
            --urls "$SUI_CATALOG_URL" >catalog.log 2>&1 &
          catalog_pid=$!
          trap 'kill "$catalog_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent "$SUI_CATALOG_URL" >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat catalog.log
              exit 1
            fi
            sleep 1
          done

          mkdir -p artifacts/lighthouse
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -maxdepth 3 -name chrome -type f | head -1)"
          export CHROME_PATH
          npx --yes lighthouse@12 "$SUI_CATALOG_URL" \
            --preset=desktop \
            --quiet \
            --output=json \
            --output-path=artifacts/lighthouse/report.json \
            --budget-path=eng/lighthouse-budget.json \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage"

          node scripts/check-lighthouse.mjs artifacts/lighthouse/report.json

      - name: Preserve Lighthouse report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-report
          if-no-files-found: ignore
          path: |
            artifacts/lighthouse/report.json
            catalog.log

  publish:
    name: Publish tagged package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [css, pack, component-tests, browser-tests, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Validate release tag
        shell: bash
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH[-prerelease]: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "SUI_PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore src/Sufficit.Blazor.UI.csproj

      - name: Pack exact release artifact
        run: |
          dotnet pack src/Sufficit.Blazor.UI.csproj \
            --no-restore --configuration Release --output artifacts/packages \
            /p:Version="$SUI_PACKAGE_VERSION" \
            /p:ContinuousIntegrationBuild=true

      - name: Validate exact release artifact
        run: ./scripts/validate-package.sh artifacts/packages/*.nupkg

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push artifacts/packages/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}"
