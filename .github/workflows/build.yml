name: Build

# This repository has no local build environment behind it: components are
# copied in from other projects, so CI is the only thing that proves they
# actually compile. Keep this workflow fast and unconditional.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Sufficit.Blazor.UI/Sufficit.Blazor.UI.csproj

      - name: Build (warnings treated as errors)
        # Captures the log so the diagnostic step below can surface failures as
        # annotations. Raw job logs live in storage that is not always
        # reachable, and annotations are, so this is what makes a red build
        # actually diagnosable.
        id: build
        run: |
          set -o pipefail
          dotnet build src/Sufficit.Blazor.UI/Sufficit.Blazor.UI.csproj \
            --no-restore --configuration Release -warnaserror \
            /p:ErrorEndLocation=true -maxcpucount:1 2>&1 | tee build.log

      - name: Diagnose Razor item inclusion
        # Decisive check: are the vendored .razor files even seen as
        # RazorComponent items? "No errors from Vendor" is ambiguous — it looks
        # the same whether the files compile cleanly or are never compiled.
        if: always()
        run: |
          TOTAL=$(dotnet msbuild src/Sufficit.Blazor.UI/Sufficit.Blazor.UI.csproj \
            -getItem:RazorComponent -v:q 2>/dev/null | grep -c '\.razor' || echo "0")
          VENDOR=$(dotnet msbuild src/Sufficit.Blazor.UI/Sufficit.Blazor.UI.csproj \
            -getItem:RazorComponent -v:q 2>/dev/null | grep -c 'Vendor' || echo "0")
          echo "::error::RazorComponent items total=${TOTAL} vendor=${VENDOR}"

      - name: Surface build diagnostics
        # Re-emits compiler output as workflow errors so it shows up as
        # annotations. Without this, a failure that the annotation parser does
        # not recognise leaves nothing but an exit code.
        if: failure()
        run: |
          echo "--- first 60 diagnostic lines ---"
          grep -nE "error|warning [A-Z]+[0-9]+" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "--- razor/component related ---"
          grep -niE "razor|taghelper|component" build.log | head -20 | while IFS= read -r line; do
            echo "::error::RAZOR ${line}"
          done
