name: CodeQL

# Semantic analysis. Lower stakes than in an identity provider, but these
# components get copied into several applications, so a defect here propagates
# rather than staying contained.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: csharp
          build-mode: manual

      - name: Build
        run: |
          dotnet restore src/Sufficit.Blazor.UI/Sufficit.Blazor.UI.csproj
          dotnet build src/Sufficit.Blazor.UI/Sufficit.Blazor.UI.csproj --no-restore --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          category: "/language:csharp"
