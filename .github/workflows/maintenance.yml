name: NuGet legacy version cleanup

on:
  workflow_dispatch:
    inputs:
      replacement:
        description: "Published replacement in Sufficit format 2.yy.MMdd.HHmm"
        required: true
        type: string
      apply:
        description: "Unlist the five legacy versions (false only inspects)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nuget-legacy-cleanup
  cancel-in-progress: false

jobs:
  unlist:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      # Trusted Publishing: the unlist credential is minted per run by NuGet
      # from this repository's OIDC token. No long-lived API key is stored.
      id-token: write
    steps:
      - name: Verify NuGet policy creator is configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          test -n "$NUGET_USER" || { echo "Set Actions variable NUGET_USER to the NuGet username that created the trust policy (not the package owner)." >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Requested immediately before the call that needs it, as in the publish job.
      # The trust policy backing this login must allow the "Unlist or relist
      # package versions" scope and name THIS workflow file; a push-only policy
      # mints a credential that fails the DELETE with HTTP 403.
      - name: Authenticate with NuGet using GitHub OIDC
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Inspect or unlist only the approved legacy versions
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          REPLACEMENT: ${{ inputs.replacement }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--replacement "$REPLACEMENT")
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python3 scripts/unlist_legacy_packages.py "${args[@]}"
