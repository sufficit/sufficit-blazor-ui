name: Publish Packages

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SRC_DIR: ./src
      NUPKGS_DIR: ${{ github.workspace }}/src/nupkgs
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET Environment
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          10.0.x

    - name: Install dependencies
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet restore ./Sufficit.Blazor.UI.csproj

    - name: Build
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet build ./Sufficit.Blazor.UI.csproj --no-restore --configuration Packing -warnaserror

    - name: Deploy Package
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet pack ./Sufficit.Blazor.UI.csproj --no-restore --configuration Packing --output ${{ env.NUPKGS_DIR }}

    - name: Inspect package and test minimal consumers
      run: ./scripts/validate-package.sh "${NUPKGS_DIR}"/*.nupkg

    - name: Publish to Nuget.Org
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet nuget push --skip-duplicate ${{ env.NUPKGS_DIR }}/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{secrets.NUGET_API_KEY}}

    # GitHub Packages disabled - only NuGet.org is used
    # - name: Publish to GitHub
    #   working-directory: ${{ env.SRC_DIR }}
    #   run: dotnet nuget push --skip-duplicate ${{ env.NUPKGS_DIR }}/*.nupkg --source https://nuget.pkg.github.com/${{github.repository_owner}}/index.json --api-key ${{github.token}}
    #   continue-on-error: ${{ env.GITHUBPACKAGEISREQUIRED != 'true' }}
