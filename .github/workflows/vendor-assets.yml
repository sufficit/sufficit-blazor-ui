name: Vendor web assets

# Brings MudBlazor's compiled CSS/JS into the repository.
#
# Upstream generates these from SCSS and TypeScript through an npm pipeline.
# Importing that toolchain would add sass, node and a build graph to a project
# that otherwise needs only the .NET SDK, so we take the already-compiled
# artifacts from the published package instead and commit them. They are MIT
# like the rest of the vendored source; the attribution in Vendor/ covers them.
#
# Run manually when syncing with a new upstream version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "MudBlazor version to take assets from (blank = latest 9.x)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          REQUESTED="${{ github.event.inputs.version }}"
          if [ -z "$REQUESTED" ]; then
            REQUESTED=$(curl -sS https://api.nuget.org/v3-flatcontainer/mudblazor/index.json \
              | python3 -c "import json,sys; v=[x for x in json.load(sys.stdin)['versions'] if x.startswith('9.') and '-' not in x]; print(v[-1])")
          fi
          echo "version=${REQUESTED}" >> "$GITHUB_OUTPUT"
          echo "Using MudBlazor ${REQUESTED}"

      - name: Download and extract assets
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          curl -sSL -o mudblazor.nupkg \
            "https://api.nuget.org/v3-flatcontainer/mudblazor/${V}/mudblazor.${V}.nupkg"
          mkdir -p pkg && unzip -q -o mudblazor.nupkg -d pkg

          echo "--- asset candidates in the package ---"
          find pkg -name "*.css" -o -name "*.js" | grep -iv "\.map$" | head -20

          DEST="src/Sufficit.Blazor.UI/wwwroot"
          mkdir -p "$DEST"
          # Static web assets live under staticwebassets/ in modern packages and
          # under content/ or contentFiles/ in older ones; accept either.
          find pkg \( -path "*staticwebassets*" -o -path "*content*" \) \
            \( -name "*.css" -o -name "*.js" \) ! -name "*.map" \
            -exec cp -v {} "$DEST"/ \;

          echo "--- vendored ---"
          ls -la "$DEST"

      - name: Record provenance
        run: |
          cat > src/Sufficit.Blazor.UI/wwwroot/README.md <<EOF
          # Web assets (vendored)

          Compiled CSS/JS taken from the MudBlazor NuGet package, version
          \`${{ steps.ver.outputs.version }}\`, rather than built from SCSS and
          TypeScript here — importing that toolchain would add node and sass to a
          project that otherwise needs only the .NET SDK.

          MIT, like the rest of the vendored source. See
          \`../Vendor/LICENSE-MudBlazor.txt\`.

          Regenerate with the "Vendor web assets" workflow, giving the version to
          sync to. Do not edit these files by hand: the next sync overwrites them.
          EOF

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Sufficit.Blazor.UI/wwwroot
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "chore(assets): vendor MudBlazor web assets ${{ steps.ver.outputs.version }}"
          git push
